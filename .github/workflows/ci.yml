name: C++ library CI

on:
  push:
    paths:
      - "components/hacan/protocol/**"
      - ".github/workflows/ci.yml"
      - "CMakeLists.txt"
  pull_request:
    paths:
      - "components/hacan/protocol/**"
      - ".github/workflows/ci.yml"
      - "CMakeLists.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test C++17 protocol library
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure
        run: cmake -S components/hacan/protocol -B build/protocol

      - name: Build
        run: cmake --build build/protocol --parallel

      - name: Test
        run: ctest --test-dir build/protocol --output-on-failure

  esphome:
    name: Validate ESPHome adapter
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install ESPHome
        run: pip install esphome

      - name: Validate example configuration
        run: |
          esphome config examples/minimal.yaml
          esphome config examples/entities.yaml

      - name: Compile ESP-IDF example
        run: esphome compile examples/minimal.yaml
