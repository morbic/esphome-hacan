name: C++ library CI

on:
  push:
    paths:
      - "components/hacan/**"
      - "examples/**"
      - ".github/workflows/ci.yml"
      - "CMakeLists.txt"
  pull_request:
    paths:
      - "components/hacan/**"
      - "examples/**"
      - ".github/workflows/ci.yml"
      - "CMakeLists.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test C++17 protocol library
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure
        run: cmake -S components/hacan/protocol -B build/protocol

      - name: Build
        run: cmake --build build/protocol --parallel

      - name: Test
        run: ctest --test-dir build/protocol --output-on-failure

  esphome:
    name: ESPHome (${{ matrix.framework }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: ESP-IDF
            config: examples/minimal.yaml
          - framework: Arduino
            config: examples/minimal-arduino.yaml
          - framework: ESP-IDF endpoints
            config: examples/endpoints.yaml
          - framework: Arduino endpoints
            config: examples/endpoints-arduino.yaml

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install ESPHome
        run: pip install esphome

      - name: Validate example configuration
        run: |
          esphome config ${{ matrix.config }}
          esphome config examples/entities.yaml
          esphome config examples/commissioning-primary.yaml
          esphome config examples/commissioning-peer.yaml
          esphome config examples/endpoints.yaml
          esphome config examples/endpoints-arduino.yaml

      - name: Reject legacy manual entity lists
        run: |
          if esphome config tests/configurations/legacy-entity-lists.yaml; then
            echo "Legacy owned_entities/observed_entities configuration was accepted"
            exit 1
          fi

      - name: Compile example
        run: esphome compile ${{ matrix.config }}
