esphome:
  name: hacan-commissioning-primary

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../components

logger:
  level: DEBUG

canbus:
  - platform: esp32_can
    id: hacan_bus
    can_id: 0x000
    bit_rate: 125kbps
    tx_pin: GPIO5
    rx_pin: GPIO4

hacan:
  canbus_id: hacan_bus
  commissioning_role: primary
  observed_entities:
    - entity_id: 0x01010001
