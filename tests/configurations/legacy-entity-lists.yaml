esphome:
  name: hacan-legacy-entity-lists

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: ../../components

canbus:
  - platform: esp32_can
    id: hacan_bus
    can_id: 0x000
    bit_rate: 125kbps
    tx_pin: GPIO5
    rx_pin: GPIO4

hacan:
  canbus_id: hacan_bus
  owned_entities:
    - entity_id: 0x01010001
      endpoint: 0x01
  observed_entities:
    - entity_id: 0x01020001
